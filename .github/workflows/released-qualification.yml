name: Released runtime Linux qualification

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Check reviewed baseline, or collect a candidate for separate review
        type: choice
        options: [check, generate]
        default: check

jobs:
  released-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUNDLE_FROZEN: 'true'
      EMF_BACKEND: auto
      QUALIFICATION_MODE: ${{ inputs.mode || 'check' }}
      MANIFEST: spec/fixtures/parity_manifest.yml
      BASELINE: spec/fixtures/resource_limits/emfsvg-v1.yml
      OUTER_TIMEOUT: '30'
      OUTER_RSS: '512'
      OUTER_AS: '2048'
    steps:
      - name: Set evidence paths
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/released-qualification"
          printf 'EVIDENCE=%s\nEMF_RELEASE_PACKAGE=%s/emf.gem\nEMF_NATIVE_LIBRARY=%s/libemf_ffi.so\nEMF_NATIVE_PROVENANCE=%s/native.json\n' \
            "$evidence" "$evidence" "$evidence" "$evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
      - name: Require reviewed released manifest and Rubygems lock
        shell: bash
        run: |
          mkdir -p "$EVIDENCE"
          ruby scripts/qualify_released_runtime.rb plan "$MANIFEST" Gemfile.lock | tee "$EVIDENCE/plan.json"
          test -n "$OUTER_TIMEOUT" && test -n "$OUTER_RSS" && test -n "$OUTER_AS"
          if [ "$QUALIFICATION_MODE" = check ]; then
            test -f "$BASELINE"
            sha256sum "$BASELINE" > "$EVIDENCE/reviewed-baseline.sha256"
          elif [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$QUALIFICATION_MODE" != generate ]; then
            echo 'Candidate generation requires explicit manual dispatch' >&2
            exit 1
          fi
      - name: Download and verify the released package and pinned native evidence
        shell: bash
        run: |
          package_url="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("package_url")' "$EVIDENCE/plan.json")"
          curl --fail --location --proto '=https' --proto-redir '=https' "$package_url" --output "$EMF_RELEASE_PACKAGE"
          ruby scripts/qualify_released_runtime.rb archive "$MANIFEST" "$EMF_RELEASE_PACKAGE" | tee "$EVIDENCE/archive.json"
          native_url="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("native_package_url")' "$EVIDENCE/plan.json")"
          curl --fail --location --proto '=https' --proto-redir '=https' "$native_url" --output "$EVIDENCE/native.gem"
          ruby scripts/qualify_released_runtime.rb native "$MANIFEST" "$EVIDENCE/native.gem" \
            "$EMF_NATIVE_LIBRARY" "$EMF_NATIVE_PROVENANCE" | tee "$EVIDENCE/native-archive.json"
          printf '%s\n' "$package_url" "$native_url" > "$EVIDENCE/download-urls.txt"
          mkdir -p vendor/cache
          package_name="${package_url##*/}"
          cp "$EMF_RELEASE_PACKAGE" "vendor/cache/$package_name"
          bundle install
      - name: Exercise the installed released native package
        shell: bash
        run: |
          installed="$RUNNER_TEMP/emfsvg-installed-release"
          mkdir -p "$installed"
          env -u RUBYOPT -u RUBYLIB -u BUNDLE_GEMFILE GEM_HOME="$installed" \
            gem install "$EVIDENCE/native.gem" --no-document
          revision="$(ruby -ryaml -e 'puts YAML.safe_load_file(ARGV.fetch(0)).dig("provenance", "runtime", "source_revision")' "$MANIFEST")"
          native_sha="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("artifact_sha256")' "$EMF_NATIVE_PROVENANCE")"
          probe="$GITHUB_WORKSPACE/scripts/support/installed_source_contract_probe.rb"
          fixture="$GITHUB_WORKSPACE/spec/fixtures/image1.emf"
          cd "$RUNNER_TEMP"
          env -u RUBYOPT -u RUBYLIB -u BUNDLE_GEMFILE -u EMF_NATIVE_LIBRARY \
            GEM_HOME="$installed" EMF_BACKEND=native ruby "$probe" "$installed" "$revision" "$fixture" "$native_sha" \
            > "$EVIDENCE/installed-contracts.json"
      - name: Fetch pinned corpus and qualify pinned portable fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig p7zip-full
          corpus_revision="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("corpus_revision")' "$EVIDENCE/plan.json")"
          corpus_root="$RUNNER_TEMP/released-corpus"
          git init "$corpus_root"
          git -C "$corpus_root" remote add origin https://github.com/claricle/emf.git
          git -C "$corpus_root" fetch --depth 1 origin "$corpus_revision"
          git -C "$corpus_root" checkout --detach FETCH_HEAD
          test "$(git -C "$corpus_root" rev-parse HEAD)" = "$corpus_revision"
          printf 'EMF_FIXTURE_ROOT=%s\n' "$corpus_root" >> "$GITHUB_ENV"
          EMF_FIXTURE_ROOT="$corpus_root" bundle exec ruby -rjson -rfileutils -rrbconfig -e '
            directory = File.join(ENV.fetch("RUNNER_TEMP"), "released-fonts")
            FileUtils.mkdir_p(directory)
            options = { "staging_directory" => directory, "corpus_root" => ENV.fetch("EMF_FIXTURE_ROOT"),
                        "output_directory" => File.join(directory, "qualified"),
                        "contract_path" => File.join(directory, "contract.json") }
            path = File.join(directory, "options.json")
            File.write(path, JSON.generate(options))
            abort "Font provisioning failed" unless system(RbConfig.ruby, "scripts/provision_qualification_fonts.rb", path)
            abort "Font qualification failed" unless system(RbConfig.ruby, "scripts/qualify_fonts.rb", options.fetch("contract_path"), "--ruby-only")
            evidence = File.join(ENV.fetch("EVIDENCE"), "fonts")
            FileUtils.mkdir_p(evidence)
            FileUtils.cp(options.fetch("contract_path"), evidence)
            FileUtils.cp(File.join(options.fetch("output_directory"), "qualification.json"), evidence)
            File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
              file.puts "FONTCONFIG_FILE=#{File.join(options.fetch("output_directory"), "fonts.conf")}"
              file.puts "FONTCONFIG_PATH=#{options.fetch("output_directory")}"
            end
          ' 2>&1 | tee "$EVIDENCE/fonts.log"
      - name: Verify public contracts and collect bounded Linux observations
        shell: bash
        run: |
          if [ "$QUALIFICATION_MODE" = generate ]; then
            destination=(--output "$EVIDENCE/candidate-emfsvg-v1.yml")
          else
            destination=(--baseline "$BASELINE")
          fi
          # The CLI verifies archive/installed bytes, ABI, native auto selection and all three backends first.
          bundle exec ruby scripts/calibrate_resource_limits.rb "$QUALIFICATION_MODE" \
            --manifest "$MANIFEST" --fixture-root "$EMF_FIXTURE_ROOT" "${destination[@]}" \
            --timeout-seconds "$OUTER_TIMEOUT" --outer-rss-cap-mib "$OUTER_RSS" --outer-as-cap-mib "$OUTER_AS" \
            2>&1 | tee "$EVIDENCE/calibration.log"
      - name: Run full acceptance with the reviewed baseline
        if: env.QUALIFICATION_MODE == 'check'
        shell: bash
        run: |
          bundle exec rspec --format progress --format json --out "$EVIDENCE/rspec.json" \
            2>&1 | tee "$EVIDENCE/rspec.log"
          bundle exec ruby scripts/qualify_released_runtime.rb acceptance "$MANIFEST" "$EVIDENCE/rspec.json" \
            | tee "$EVIDENCE/acceptance.json"
      - name: Preserve reviewed fixture bytes
        if: always()
        shell: bash
        run: |
          if [ -f "$EVIDENCE/reviewed-baseline.sha256" ]; then
            sha256sum --check "$EVIDENCE/reviewed-baseline.sha256"
          fi
          git diff --exit-code -- spec/fixtures Gemfile.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-linux-${{ inputs.mode || 'check' }}-evidence
          path: ${{ runner.temp }}/released-qualification/
          if-no-files-found: warn
