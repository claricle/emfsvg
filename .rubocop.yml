---
inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  SuggestExtensions: false
  Exclude:
    - "pkg/**/*"
    - "vendor/**/*"
    - "spec/fixtures/**/*"

Layout/LineLength:
  Max: 140

Metrics/MethodLength:
  Max: 35
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"

Metrics/ModuleLength:
  Max: 400

Metrics/ClassLength:
  Max: 400
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"

Metrics/AbcSize:
  Max: 70
  Exclude:
    - "lib/emfsvg/renderer.rb"
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"

Metrics/CyclomaticComplexity:
  Max: 16
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"

Metrics/PerceivedComplexity:
  Max: 18
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"

Lint/UselessConstantScoping:
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"

Metrics/ParameterLists:
  Max: 11

Metrics/BlockLength:
  Exclude:
    - "emfsvg.gemspec"
    - "spec/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Naming/MethodParameterName:
  AllowedNames:
    - x
    - y
    - cx
    - cy
    - dx
    - dy
    - m11
    - m12
    - m21
    - m22
    - id
    - io
    - dc
    - b
    - t
    - l
    - r
    - d
    - a
    - w
    - h
    - n
    - rx
    - ry
    - r1
    - r2
    - g1
    - g2
    - x1
    - x2
    - y1
    - y2

Lint/FloatComparison:
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"

Style/FormatStringToken:
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"
    - "lib/emfsvg/svg_builder.rb"
    - "lib/emfsvg/compat.rb"
    - "spec/round_trip_spec.rb"

Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/round_trip_spec.rb"

Layout/LineLength:
  Exclude:
    - "spec/round_trip_spec.rb"

Lint/MissingSuper:
  Exclude:
    - "lib/emfsvg/**/*.rb"

Lint/DuplicateBranch:
  Exclude:
    - "lib/emfsvg/visitors/emr_visitor.rb"
    - "lib/emfsvg/clip_region.rb"
